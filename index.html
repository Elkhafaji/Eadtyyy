<script>
'use strict';
const CONFIG={KEY:'eyadaty_db_v4',SKEY:'eyadaty_session_v4',MODE:'server',API_BASE:'/api',POLL:5000};

async function hashPw(pw,salt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'::'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;const s=salt+'::'+pw;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return'f'+(h>>>0).toString(16)}}

 },

 <button type="button" class="icon-btn" data-act="rxDelRow">${ic('x',16)}</button>`;
 $('#rxRows').appendChild(div)};
A.rxDelRow=(ds,el)=>el.closest('.rxrow')?.remove();
const collectRx=()=>$$('#rxRows .rxrow').map(r=>({medicine:r.querySelector('[name=medicine]').value.trim(),dose:r.querySelector('[name=dose]').value.trim(),frequency:r.querySelector('[name=frequency]').value.trim(),duration:r.querySelector('[name=duration]').value.trim(),instructions:r.querySelector('[name=instructions]').value.trim()})).filter(r=>r.medicine);
F.consult=async(fd,f)=>{
 const data={chiefComplaint:fd.get('cc')||'',symptoms:fd.get('sym')||'',vitals:{bp:fd.get('bp')||'',pulse:fd.get('pu')||'',temp:fd.get('te')||'',weight:fd.get('we')||''},examination:fd.get('ex')||'',diagnosis:(fd.get('dg')||'').trim(),notes:fd.get('nt')||'',treatment:fd.get('tr')||'',followUp:fd.get('fu')||''};
 if(!data.diagnosis)throw Err(t('diagReq','التشخيص مطلوب'));
 const items=collectRx();
 svc.saveVisit(f.dataset.ticket,data,{items,notes:fd.get('rxnotes')||''},Auth.user()?.id);
 toast(t('visitSaved','تم حفظ الكشف'+(items?' والروشتة':'')));location.hash='#/doctor/queue'};
F.rxNew=async fd=>{const items=collectRx();
 if(!items.length)throw Err(t('addMedFirst','أضف دواء واحدًا على الأقل'));
 if(!fd.get('patientId'))throw Err(t('choosePat','اختر المريض'));
 const rx=svc.saveRx({patientId:fd.get('patientId'),doctorId:Auth.user().id,items,notes:fd.get('notes'),diagnosis:fd.get('diagnosis')},Auth.user()?.id);
 $$('#rxRows .rxrow').forEach(r=>r.remove());toast(t('rxSaved','تم حفظ الروشتة'));
 await showRxModal(rx)};
A.rxView=async ds=>{const rx=DB.get('prescriptions',ds.id);if(!rx)return;await showRxModal(rx)};
C.slots=el=>renderSlots(el.closest('form'));
A.pickSlot=(ds,el)=>{const f=el.closest('form');f.querySelector('[name=time]').value=ds.time;
 f.querySelectorAll('.slot').forEach(b=>b.classList.remove('sel'));el.classList.add('sel')};
F.book=fd=>{const u=Auth.user();if(!fd.get('time'))throw Err(t('pickSlot','اختر موعدًا من القائمة'));
 svc.book({patientId:u.id,doctorId:fd.get('doctorId'),date:fd.get('date'),time:fd.get('time'),by:u.id});
 toast(t('booked','تم تأكيد حجزك — تابع رقمك من الطابور 🎉'));location.hash='#/patient'};
A.patSelfCheckin=ds=>{try{svc.checkIn(ds.id,Auth.user()?.id);toast(t('checkedInOk','تم تسجيل وصولك وأخذ رقمك في الطابور'));render()}catch(e){toast(e.message,'err')}};
A.pickPat=ds=>{const pid=$('#recPid');if(pid)pid.value=ds.id;
 const chip=$('#recPatChip');if(chip)chip.innerHTML=`<div class="mt"><span class="chip">${ic('check',13)} ${esc(ds.name)}</span></div>`;
 const box=$('#patResults');if(box)box.innerHTML=''};
A.quickPat=()=>{openModal(`<h3 class="mb">${t('quickAddPat','إضافة مريض سريع')}</h3>
 <form data-form="quickPatF">
  <div class="field"><label class="flabel">${t('name','الاسم')}</label><input class="inp" name="name" required></div>
  <div class="field"><label class="flabel">${t('phone','الهاتف')}</label><input class="inp" name="phone" required dir="ltr"></div>
  <div class="hint">${t('tempPw','كلمة المرور المؤقتة = رقم الهاتف (يغيّرها المريض لاحقًا من إعداداته)')}</div>
  <div class="mrow"><button type="button" class="btn ghost" data-act="closeModal">${t('cancel','إلغاء')}</button><button class="btn" type="submit">${t('create','إنشاء')}</button></div></form>`)};
F.quickPatF=async fd=>{const phone=fd.get('phone').trim();
 if(DB.all('users').some(x=>x.phone===phone))throw Err(t('phoneUsed','الهاتف مستخدم بالفعل'));
 const salt=uid();const p=DB.insert('users',{role:'patient',name:fd.get('name').trim(),phone,email:'',salt,hash:await hashPw(phone,salt),active:true});
 audit(Auth.user()?.id,'receptionist','PATIENT_CREATED',p.name);closeModal();
 const pid=$('#recPid');if(pid)pid.value=p.id;
 const chip=$('#recPatChip');if(chip)chip.innerHTML=`<div class="mt"><span class="chip">${ic('check',13)} ${esc(p.name)}</span></div>`;
 toast(t('patAdded','تمت إضافة المريض'))};
F.recBook=fd=>{if(!fd.get('patientId'))throw Err(t('pickPatFirst','اختر المريض أولًا'));
 if(!fd.get('time'))throw Err(t('pickSlot','اختر موعدًا من القائمة'));
 svc.book({patientId:fd.get('patientId'),doctorId:fd.get('doctorId'),date:fd.get('date'),time:fd.get('time'),by:Auth.user()?.id});
 toast(t('bookedR','تم تأكيد الحجز'));location.hash='#/reception/appointments'};
C.recDate=el=>{location.hash='#/reception/appointments?date='+el.value};
C.docDate=el=>{location.hash='#/doctor/appointments?date='+el.value};
A.apptCheckin=ds=>{try{svc.checkIn(ds.id,Auth.user()?.id);toast(t('checkedInOk','تم تسجيل الوصول وإضافة المريض للطابور'));render()}catch(e){toast(e.message,'err')}};
A.apptCancel=async ds=>{if(!await confirmDlg(t('cancelQ','تأكيد إلغاء هذا الموعد؟')))return;
 svc.cancelAppt(ds.id,Auth.user()?.id);toast(t('apptCancelled','تم إلغاء الموعد'));render()};
A.apptPay=ds=>{const a=DB.get('appointments',ds.id);if(!a)return;
 openModal(`<h3 class="mb">${t('payNow','تسجيل دفع الكشف')}</h3>
 <div class="card pad" style="box-shadow:none"><b style="font-size:20px">${money(a.price)}</b><br><small style="color:var(--muted)">${esc(DB.get('users',a.patientId)?.name||'')} — ${fmtD(a.date)} ${a.time}</small></div>
 <div class="field mt"><label class="flabel">${t('method','طريقة الدفع')}</label>
 <select class="inp" id="payMethod"><option value="cash">${t('cashM','نقدي')}</option><option value="card">${t('card','بطاقة')}</option></select></div>
 <div class="mrow"><button class="btn ghost" data-act="closeModal">${t('cancel','إلغاء')}</button><button class="btn oks" id="payOk">${ic('cash',16)} ${t('confirmPay','تأكيد الدفع')}</button></div>`);
 $('#payOk').onclick=()=>{try{svc.pay(ds.id,$('#payMethod').value,Auth.user());closeModal();toast(t('paidOk','تم الدفع — وصل الإشعار للمريض وزاد الإيراد'));render()}catch(e){toast(e.message,'err')}}};
F.medInfo=fd=>{const u=Auth.user(),pid=fd.get('pid');
 if(u.role==='patient'&&u.id!==pid)throw Err(t('notAllowed','غير مصرح'));
 if(u.role==='doctor'&&!DB.all('appointments').some(a=>a.patientId===pid&&a.doctorId===u.id))throw Err(t('notAllowed','غير مصرح'));
 DB.update('users',pid,{allergies:fd.get('allergies')||'',chronic:fd.get('chronic')||'',conditions:fd.get('conditions')||'',medications:fd.get('medications')||'',medicalNotes:fd.get('medicalNotes')||''});
 audit(u.id,u.role,'MEDICAL_RECORD_UPDATED',pid);toast(t('saved','تم الحفظ'))};
F.fileUp=async(fd,f)=>{const file=f.querySelector('[name=file]').files[0];
 if(!file)throw Err(t('pickFileFirst','اختر ملفًا'));
 if(!/^image\//.test(file.type)&&file.type!=='application/pdf')throw Err(t('badType','النوع غير مسموح — صورة أو PDF فقط'));
 if(file.size>1.5e6)throw Err(t('bigFile','حجم الملف أكبر من 1.5MB'));
 const dataUrl=await readURL(file);
 svc.addFile({patientId:Auth.user().id,name:(fd.get('name')||file.name).trim(),kind:fd.get('kind'),fileName:file.name,mime:file.type,dataUrl,size:file.size,by:Auth.user().id});
 toast(t('uploaded','تم رفع الملف'));render()};
A.fileView=ds=>{const f=DB.get('medical_files',ds.id);if(!f)return;
 const body=/^image\//.test(f.mime)?`<img class="rximg" src="${f.dataUrl}">`:`<iframe src="${f.dataUrl}" style="width:100%;height:70vh;border:none;border-radius:10px"></iframe>`;
 openModal(`<h3 class="mb">${esc(f.name)}</h3>${body}<div class="mrow"><a class="btn" href="${f.dataUrl}" download="${esc(f.fileName||f.name)}">${ic('download',16)} ${t('download','تحميل')}</a><button class="btn ghost" data-act="closeModal">${t('close','إغلاق')}</button></div>`,'wide')};
C.chatAttach=async el=>{const f=el.files[0];if(!f)return;
 if(f.size>1.5e6){toast(t('bigFile','حجم الملف أكبر من 1.5MB'),'err');el.value='';return}
 CHAT_PENDING={fileName:f.name,mime:f.type,dataUrl:await readURL(f)};
 const chip=$('#attChip');if(chip)chip.innerHTML=`<span class="chip">📎 ${esc(f.name)} <button style="border:none;background:none;color:inherit" data-act="attRm">${ic('x',12)}</button></span>`};
A.attRm=()=>{CHAT_PENDING=null;const c=$('#attChip');if(c)c.innerHTML='';const f=$('#chatFile');if(f)f.value=''};
F.chat=async(fd,f)=>{const u=Auth.user();const body=(fd.get('body')||'').trim();
 if(!body&&!CHAT_PENDING)throw Err(t('typeMsgFirst','اكتب رسالة أو أرفق ملفًا'));
 const patientId=u.role==='patient'?u.id:f.dataset.pid;
 svc.sendMsg({patientId,senderId:u.id,senderRole:u.role,body,attachment:CHAT_PENDING});
 CHAT_PENDING=null;render()};
F.staffProfile=fd=>{DB.update('users',Auth.user().id,{name:fd.get('name').trim(),phone:fd.get('phone').trim()});toast(t('saved','تم الحفظ'));render()};
F.patSet=fd=>{const u=Auth.user();const email=(fd.get('email')||'').trim().toLowerCase();
 if(email&&DB.all('users').some(x=>x.id!==u.id&&(x.email||'').toLowerCase()===email))throw Err(t('emailUsed','البريد مستخدم بالفعل'));
 DB.update('users',u.id,{name:fd.get('name').trim(),phone:fd.get('phone').trim(),email,dob:fd.get('dob')||'',gender:fd.get('gender')||'',address:fd.get('address')||'',emergencyContact:fd.get('emergencyContact')||''});
 toast(t('saved','تم الحفظ'));render()};
function doPatSearch(el){const q=el.value.trim();const box=el.closest('.card')?.querySelector('#patResults')||$('#patResults');
 if(!box)return;if(q.length<2){box.innerHTML='';return}
 const res=DB.all('users').filter(x=>x.role==='patient'&&x.active&&((x.name||'').includes(q)||(x.phone||'').includes(q))).slice(0,8);
 box.innerHTML=res.length?`<div class="card pad mt" style="box-shadow:none">${res.map(p=>`<div class="qrow" style="cursor:pointer" data-act="pickPat" data-id="${p.id}" data-name="${esc(p.name)}">${av(p)}<div style="flex:1"><b>${esc(p.name)}</b><br><small style="color:var(--muted)" dir="ltr">${esc(p.phone||'')}</small></div>${ic('plus',16)}</div>`).join('')}</div>`:`<div class="hint">${t('noResult','لا نتائج مطابقة')}</div>`}
function parseHash(){const h=(location.hash||'').replace(/^#\/?/,'');const[path,q]=h.split('?');return{segs:path.split('/').filter(Boolean),params:new URLSearchParams(q||'')}}
let renderToken=0;
async function render(){const tk=++renderToken;
 try{
  const u=Auth.user();const{segs,params}=parseHash();const root=segs[0]||'';
  const roleRoot={admin:'admin',doctor:'doctor',reception:'receptionist',manager:'manager',patient:'patient'};
  if(roleRoot[root]){if(!u){location.replace('#/login');return}if(u.role!==roleRoot[root]){location.replace(homeOf(u.role));return}}
  else if(root==='login'||root==='register'){if(u){location.replace(homeOf(u.role));return}}
  else if(!root&&u){location.replace(homeOf(u.role));return}
  const key=segs.slice(0,2).join('/');
  const view=VIEWS[key]||VIEWS[root]||VIEWS.home;
  const html=await view({u,segs,params});
  if(tk!==renderToken)return;
  $('#app').innerHTML=html;
  document.title=S().clinicName||'عيادتي';
  const th=$('#thread');if(th)th.scrollTop=th.scrollHeight;
 }catch(e){console.error(e);
  $('#app').innerHTML=`<div class="auth"><div class="formside"><div class="abox card">${emptyHtml(t('errPage','حدث خطأ غير متوقع'),e.message)}<button class="btn" onclick="location.hash='#/';location.reload()">${t('reload','إعادة التحميل')}</button></div></div></div>`}}
document.addEventListener('click',async e=>{
 const actEl=e.target.closest('[data-act]');
 if(!e.target.closest('.drop')){const keep=actEl?.dataset.dropTarget;$$('.drop.open').forEach(d=>{if(!keep||d.id!==keep.slice(1))d.classList.remove('open')})}
 if(e.target.closest('a.side-link')){const s=$('#side'),o=$('#ovl');if(s&&s.classList.contains('open')){s.classList.remove('open');o?.classList.remove('show')}}
 if(!actEl)return;
 const fn=A[actEl.dataset.act];
 if(fn){e.preventDefault();try{await fn(actEl.dataset,actEl,e)}catch(err){toast(err.message,'err')}}});
document.addEventListener('submit',async e=>{
 const f=e.target,fn=F[f.dataset.form];if(!fn)return;e.preventDefault();
 const btn=f.querySelector('[type=submit]');if(btn){btn.classList.add('loading');btn.disabled=true}
 try{await fn(new FormData(f),f)}catch(err){toast(err.message||t('err','حدث خطأ'),'err')}
 finally{if(btn&&document.contains(btn)){btn.classList.remove('loading');btn.disabled=false}}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.strength)paintStrength(el.value,el.dataset.strength);
 if(el.dataset.change==='searchPat'){clearTimeout(el._t);el._t=setTimeout(()=>doPatSearch(el),280)}});
document.addEventListener('change',e=>{const fn=C[e.target.dataset.change];if(fn)fn(e.target,e)});
const isTyping=()=>{const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')};
function safeRefresh(){if(isTyping()){setTimeout(safeRefresh,1500);return}render()}
window.addEventListener('storage',e=>{if(e.key===CONFIG.KEY&&e.newValue){try{DB.data=JSON.parse(e.newValue)}catch(x){return}safeRefresh()}});
setInterval(async()=>{if(document.hidden)return;
 if(CONFIG.MODE==='server'){try{const r=await fetch(CONFIG.API_BASE+'/db',{cache:'no-store'});
  if(r.ok){const j=await r.json();if(j&&j.settings&&(j.settings._rev||0)!==(DB.data.settings._rev||0)){DB.data=j;safeRefresh()}}}catch(e){}}
 else{const h=location.hash||'';
  if(h.startsWith('#/patient/queue')||h.startsWith('#/doctor/queue')||h==='#/patient'||h==='#/doctor'||h.startsWith('#/reception'))safeRefresh()}},CONFIG.POLL);
window.addEventListener('hashchange',render);
(async function init(){
 applyTheme();applyLang();
 await DB.load();
 
 if(!location.hash)location.hash=Auth.user()?homeOf(Auth.user().role):'#/';
 await render();
})();
</script>
</body>
